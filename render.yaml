services:
  - type: web
    name: student-verification-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python seed_data.py"
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: students.db
      - key: OTP_EXPIRY_SECONDS
        value: 300
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
